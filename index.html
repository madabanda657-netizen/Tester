    function showSuccess(msg){const el=document.getElementById('mada-success');el.textContent=msg;el.style.display='block';document.getElementById('mada-error').style.display='none'}
    window.madaLogin=function(){
      const username=document.getElementById('login-username').value.trim();
      const password=document.getElementById('login-password').value;
      const captchaAns=parseInt(document.getElementById('login-captcha-a').value,10);
      if(!username||!password){showError('Enter username and password');return}
      if(!captchaLogin||captchaAns!==captchaLogin.ans){showError('Wrong captcha: '+captchaLogin.q);madaRefreshCaptcha('login');return}
      const users=getUsers();const user=users.find(u=>u.username.toLowerCase()===username.toLowerCase());
      if(!user){showError('User not found. Create account.');return}
      if(user.passwordHash!==hash(password)){showError('Wrong password');return}
      localStorage.setItem(SESSION_KEY,user.username);
      try{localStorage.setItem('mada_last_email',user.email);localStorage.setItem('mada_last_name',user.username);if(user.airtel)localStorage.setItem('mada_last_phone',user.airtel);else if(user.tnm)localStorage.setItem('mada_last_phone',user.tnm)}catch(e){}
      hideAuth();showUserBar(user);
    };
    window.madaRegister=function(){
      const username=document.getElementById('reg-username').value.trim();
      const email=document.getElementById('reg-email').value.trim();
      const password=document.getElementById('reg-password').value;
      const confirm=document.getElementById('reg-confirm').value;
      const airtel=document.getElementById('reg-airtel').value.trim();
      const tnm=document.getElementById('reg-tnm').value.trim();
      const ageChecked=document.getElementById('reg-age').checked;
      const captchaAns=parseInt(document.getElementById('reg-captcha-a').value,10);
      if(username.length<3){showError('Username min 3 chars');return}
      if(!/^[a-zA-Z0-9_]+$/.test(username)){showError('Username: letters, numbers, underscore only');return}
      if(!validateEmail(email)){showError('Valid email required for reset');return}
      if(password.length<6){showError('Password min 6 chars');return}
      if(password!==confirm){showError('Passwords no match');return}
      if(!airtel&&!tnm){showError('Add at least one number (Airtel/TNM) - will be locked');return}
      if(airtel&&!validatePhone(airtel)){showError('Invalid Airtel');return}
      if(tnm&&!validatePhone(tnm)){showError('Invalid TNM');return}
      if(!ageChecked){showError('Confirm 18+');return}
      if(!captchaReg||captchaAns!==captchaReg.ans){showError('Wrong captcha: '+captchaReg.q);madaRefreshCaptcha('register');return}
      const users=getUsers();
      if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){showError('Username taken');return}
      if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())){showError('Email already registered');return}
      const newUser={username,email,passwordHash:hash(password),airtel,tnm,airtelLocked:!!airtel,tnmLocked:!!tnm,createdAt:new Date().toISOString(),ageConfirmed:true};
      users.push(newUser);saveUsers(users);
      localStorage.setItem(SESSION_KEY,newUser.username);
      try{localStorage.setItem('mada_last_email',email);localStorage.setItem('mada_last_name',username);if(airtel)localStorage.setItem('mada_last_phone',airtel);else if(tnm)localStorage.setItem('mada_last_phone',tnm)}catch(e){}
      showSuccess('Created! Numbers locked 🔒');setTimeout(()=>{hideAuth();showUserBar(newUser)},700);
    };
    window.madaForgot=function(){
      const email=document.getElementById('forgot-email').value.trim();
      const username=document.getElementById('forgot-username').value.trim();
      const newPass=document.getElementById('forgot-password').value;
      const captchaAns=parseInt(document.getElementById('forgot-captcha-a').value,10);
      if(!validateEmail(email)){showError('Enter email');return}
      if(!username){showError('Enter username');return}
      if(newPass.length<6){showError('New pass min 6');return}
      if(!captchaForgot||captchaAns!==captchaForgot.ans){showError('Wrong captcha');madaRefreshCaptcha('forgot');return}
      const users=getUsers();const idx=users.findIndex(u=>u.email.toLowerCase()===email.toLowerCase()&&u.username.toLowerCase()===username.toLowerCase());
      if(idx===-1){showError('No account with that email+username');return}
      users[idx].passwordHash=hash(newPass);saveUsers(users);
      showSuccess('Reset done! Login now. Numbers still locked.');
      setTimeout(()=>{madaSwitchAuth('login');document.getElementById('login-username').value=username},1200);
    };
    window.madaLogout=function(){localStorage.removeItem(SESSION_KEY);document.getElementById('mada-user-bar').classList.remove('show');document.getElementById('mada-auth-overlay').style.display='flex';madaSwitchAuth('login')};
    function hideAuth(){document.getElementById('mada-auth-overlay').style.display='none'}
    function showUserBar(user){const bar=document.getElementById('mada-user-bar');document.getElementById('mada-user-name').textContent=user.username;document.getElementById('mada-user-email').textContent=user.email;const phones=[];if(user.airtel)phones.push('Airtel:'+user.airtel);if(user.tnm)phones.push('TNM:'+user.tnm);document.getElementById('mada-user-phones').textContent=phones.join(' • ')||'No number';document.getElementById('mada-user-avatar').textContent=user.username.charAt(0).toUpperCase();bar.classList.add('show')}
    function init(){
      madaRefreshCaptcha('login');madaRefreshCaptcha('register');madaRefreshCaptcha('forgot');
      const session=localStorage.getItem(SESSION_KEY);
      if(session){const users=getUsers();const user=users.find(u=>u.username===session);if(user){hideAuth();showUserBar(user);return}}
      document.getElementById('mada-auth-overlay').style.display='flex';
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  })();
  </script>

  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
</body>
</html>
